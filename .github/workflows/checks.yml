name: Checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: regression-tests-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERWIS_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=regression-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Tests/RegressionTests.csproj
  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [SerwisSystem.Client, SerwisSystem.Customer]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test Tests/frontend-api.test.mjs
        working-directory: .
