name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: serwissystem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=serwissystem_test;Username=postgres;Password=postgres"
      Jwt__Key: "ci-only-test-signing-key-do-not-use-elsewhere-0123456789"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SerwisSystem.slnx

      - name: Build
        run: dotnet build SerwisSystem.slnx --no-restore

      - name: Test
        run: dotnet test SerwisSystem.slnx --no-build

  frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [SerwisSystem.Client, SerwisSystem.Customer]

    defaults:
      run:
        working-directory: src/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
